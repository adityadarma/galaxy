[package]
name = "galaxy-bench"
description = "Benchmarks and fixture generation for Galaxy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
galaxy-core.workspace = true

[dev-dependencies]
criterion.workspace = true

# Only criterion benches should receive bench CLI flags (e.g. --quick).
[lib]
bench = false

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"
bench = false

[[bin]]
name = "workspace-index"
path = "src/bin/workspace_index.rs"
bench = false

[[bin]]
name = "file-finder"
path = "src/bin/file_finder.rs"
bench = false

[[bench]]
name = "document"
harness = false

[lints]
workspace = true
