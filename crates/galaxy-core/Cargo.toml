[package]
name = "galaxy-core"
description = "Galaxy editor core: documents, workspace, syntax, LSP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Plugin checksum verification (artifacts and installed trees).
ropey.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Atomic save: same-directory temp file + rename.
tempfile.workspace = true
# Grapheme-aware backspace/delete and cursor movement.
unicode-segmentation.workspace = true
# Lazy, gitignore-aware directory listing for the explorer.
ignore.workspace = true
# Find/replace in the current file.
regex.workspace = true
# Fuzzy file search for Go to File.
nucleo-matcher.workspace = true
# Git branch and worktree status.
gix.workspace = true
# Workspace file watcher (FSEvents).
notify.workspace = true
# Parser worker behind M3 syntax highlighting.
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-md-025.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
tree-sitter-html.workspace = true
tree-sitter-xml.workspace = true
tree-sitter-css.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-nginx.workspace = true
tree-sitter-php.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-java.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-lua.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-sequel.workspace = true
tree-sitter-make.workspace = true
tree-sitter-ini.workspace = true
tree-sitter-powershell.workspace = true
tree-sitter-dart.workspace = true
tree-sitter-r.workspace = true
# Markdown preview.
pulldown-cmark.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
bincode.workspace = true
portable-pty.workspace = true
