name: Galaxy
options:
  bundleIdPrefix: dev.adityadarma
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SPARKLE_FEED_URL: https://github.com/adityadarma/galaxy/releases/latest/download/appcast-$(ARCHS).xml
    SPARKLE_PUBLIC_ED_KEY: ""
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  GalaxyCLI:
    type: tool
    platform: macOS
    sources:
      - path: GalaxyCLI
    settings:
      base:
        PRODUCT_NAME: galaxy
        PRODUCT_MODULE_NAME: GalaxyCLI
        PRODUCT_BUNDLE_IDENTIFIER: dev.adityadarma.galaxy.cli
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  Galaxy:
    type: application
    platform: macOS
    entitlements:
      path: Galaxy/Resources/Galaxy.entitlements
      properties:
        # Sparkle is a separately signed updater framework. Hardened Runtime
        # otherwise rejects it when local builds use an ad-hoc signature.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Galaxy/Resources/Info.plist
      properties:
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUEnableAutomaticChecks: true
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
    sources:
      - path: Galaxy/Sources
      - path: Galaxy/Resources
      # Name the file, not the folder: on a fresh checkout (CI) the folder
      # does not exist until the Build Rust Core phase runs, and XcodeGen
      # skips a missing optional folder but keeps a missing optional file.
      - path: Galaxy/Generated/galaxy_ffi.swift
        optional: true
    settings:
      base:
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ONLY_ACTIVE_ARCH: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.adityadarma.galaxy
        PRODUCT_NAME: Galaxy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Galaxy/FFI/include
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Galaxy/FFI/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Galaxy/FFI
        OTHER_LDFLAGS: -lgalaxy_ffi
    preBuildScripts:
      - name: Build Rust Core
        script: |
          "${PROJECT_DIR}/../scripts/build-core.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/Galaxy/FFI/libgalaxy_ffi.a
          - $(PROJECT_DIR)/Galaxy/Generated/galaxy_ffi.swift
    postBuildScripts:
      - name: Embed Sparkle
        script: |
          ditto "${BUILT_PRODUCTS_DIR}/Sparkle.framework" "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework"
          codesign --force --deep --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime --timestamp=none "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework"
        basedOnDependencyAnalysis: false
      - name: Refresh App Bundle Timestamp
        script: |
          touch "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: GalaxyCLI
      - package: Sparkle
        product: Sparkle
        # XcodeGen emits `Sparkle` instead of `Sparkle.framework` in its
        # generated embed phase. Copy the SwiftPM framework explicitly above.
        embed: false
    copyFiles:
      - destination: executables
        files:
          - target: GalaxyCLI

  GalaxyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GalaxyTests
    dependencies:
      - target: Galaxy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.adityadarma.galaxy.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Galaxy.app/Contents/MacOS/Galaxy
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Galaxy/FFI/include
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  GalaxyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: GalaxyUITests
    dependencies:
      - target: Galaxy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.adityadarma.galaxy.uitests
        TEST_TARGET_NAME: Galaxy
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  Galaxy:
    build:
      targets:
        Galaxy: all
        GalaxyTests: [test]
    test:
      targets:
        - GalaxyTests

  # Drives the real app through the accessibility API. Kept out of the
  # default scheme because it needs a GUI session and Accessibility
  # permission; run it with scripts/ui-test.sh.
  GalaxyUI:
    build:
      targets:
        Galaxy: all
        GalaxyUITests: [test]
    test:
      targets:
        - GalaxyUITests

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
