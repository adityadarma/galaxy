name: Galaxy
options:
  bundleIdPrefix: dev.adityadarma
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Galaxy:
    type: application
    platform: macOS
    sources:
      - path: Galaxy/Sources
      - path: Galaxy/Generated
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adityadarma.galaxy
        PRODUCT_NAME: Galaxy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Galaxy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Galaxy/FFI/include
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Galaxy/FFI/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Galaxy/FFI
        OTHER_LDFLAGS: -lgalaxy_ffi
    preBuildScripts:
      - name: Build Rust Core
        script: |
          "${PROJECT_DIR}/../scripts/build-core.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/Galaxy/FFI/libgalaxy_ffi.a
          - $(PROJECT_DIR)/Galaxy/Generated/galaxy_ffi.swift

  GalaxyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GalaxyTests
    dependencies:
      - target: Galaxy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.adityadarma.galaxy.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Galaxy.app/Contents/MacOS/Galaxy
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Galaxy/FFI/include
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  GalaxyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: GalaxyUITests
    dependencies:
      - target: Galaxy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.adityadarma.galaxy.uitests
        TEST_TARGET_NAME: Galaxy
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  Galaxy:
    build:
      targets:
        Galaxy: all
        GalaxyTests: [test]
    test:
      targets:
        - GalaxyTests

  # Drives the real app through the accessibility API. Kept out of the
  # default scheme because it needs a GUI session and Accessibility
  # permission; run it with scripts/ui-test.sh.
  GalaxyUI:
    build:
      targets:
        Galaxy: all
        GalaxyUITests: [test]
    test:
      targets:
        - GalaxyUITests
