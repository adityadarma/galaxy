[workspace]
resolver = "3"
members = [
    "crates/galaxy-core",
    "crates/galaxy-ffi",
    "crates/galaxy-bench",
    "tools/uniffi-bindgen",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
galaxy-core = { path = "crates/galaxy-core" }
# `unicode_lines` is off so only `\n` breaks lines (CR is normalized on load).
# This matches LSP, which does not treat U+2028/U+0085/VT/FF as line breaks.
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "std", "registry"] }
tracing-appender = "=0.2.3"
uniffi = "=0.29.4"
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }
dhat = "=0.3.3"
tempfile = "=3.23.0"
unicode-segmentation = "=1.13.3"
# Workspace walking: gitignore-aware, same engine as ripgrep.
ignore = "=0.4.33"
# In-file find/replace. Linear-time matching, no backtracking blowups.
regex = "=1.13.1"
# Go to File (M2-07). The matcher half of helix's nucleo; MPL-2.0.
nucleo-matcher = "=0.3.1"
# Git repository state (M6-01).
gix = { version = "=0.73.0", default-features = false, features = ["status", "index", "worktree-mutation", "revision"] }
# File watcher (M2-02): FSEvents on macOS. 8.x is the latest stable line.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
# Incremental concrete syntax trees. Grammars arrive in M3-03.
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-md-025 = "=0.5.6"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-php = "=0.25.1"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# LSP JSON-RPC stdio transport. Kept feature-minimal: process, pipes and runtime.
tokio = { version = "=1.48.0", default-features = false, features = ["io-util", "process", "rt-multi-thread", "sync"] }
serde_json = "=1.0.145"
# SHA-256 for plugin artifact and tree verification.
sha2 = "=0.10.9"
# Embedded terminal PTY and ANSI grid (M6-04).
portable-pty = "=0.9.0"
alacritty_terminal = "=0.25.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
